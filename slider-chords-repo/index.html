<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slider Chords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<!-- Pour changer l'apparence : remplacer ce lien par un autre fichier CSS (ex. style-dark.css) -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="rack">
  <div class="module">
    <div class="rail">
      <div class="brand">
        <span class="kicker">C74 · RNBO EXPORT</span>
        <h1 id="patchTitle">Slider Chords</h1>
      </div>
      <div class="screws"><div class="screw"></div><div class="screw"></div></div>
    </div>

    <div class="scope">
      <div class="grid-overlay"></div>
      <canvas id="scopeCanvas"></canvas>
    </div>

    <div class="controls" id="controls"></div>

    <div class="trigger-row">
      <button class="trigger-pad" id="triggerPad" type="button">
        <span class="trigger-dot"></span>
        <span>Déclencher les accords</span>
      </button>
    </div>

    <div class="footer-row">
      <div class="power" id="powerBtn">
        <div class="led" id="powerLed"></div>
        <span id="powerLabel">Démarrer</span>
      </div>
      <div class="master">
        <span class="label">Volume</span>
        <div class="knob" id="masterKnob">
          <div class="knob-body"></div>
          <div class="pointer"></div>
        </div>
      </div>
    </div>

    <div class="hint">Cliquez sur <b>Démarrer</b> pour activer le son, puis ajustez les commandes ci-dessus.</div>
    <div class="badge-err" id="errBox"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
